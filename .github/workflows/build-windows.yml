name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build AstraVideo EXE
        run: pyinstaller --noconfirm --onefile --windowed --name AstraVideo desktop/main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AstraVideo-Windows-EXE
          path: dist/AstraVideo.exe
