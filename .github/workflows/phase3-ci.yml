name: Phase 3 CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ phase3-flutter-fastapi ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Import FastAPI app
        run: |
          cd backend
          python -c "from app.main import app; print(app.title)"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: |
          cd mobile
          flutter create . --platforms=android,ios --project-name astravideo
      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get
      - name: Analyze Flutter
        run: |
          cd mobile
          flutter analyze
      - name: Build Android debug APK
        run: |
          cd mobile
          flutter build apk --debug --dart-define=ENABLE_FIREBASE=false
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraVideo-Phase3-Debug-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
